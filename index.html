["q","Dalam sebuah diskusi kelas, guru meminta siswa menyebutkan ciri-ciri kegiatan gotong royong yang sejati. Siswa menjawab bahwa kegiatan tersebut dilakukan bersama-sama, dilandasi rasa kekeluargaan, dilakukan tanpa paksaan, dan bertujuan untuk kebaikan bersama. Berdasarkan jawaban tersebut, unsur-unsur gotong royong adalah ...",["Persaingan, individualisme, dan keuntungan pribadi","Paksaan, imbalan, dan kepentingan golongan","Kerja sama, kekeluargaan, kesukarelaan, dan kebersamaan","Kebebasan mutlak, kemandirian, dan persaingan","Perintah, hierarki, dan kewajiban tertulis"],2],

["q","Dalam pelajaran PPKn, guru menjelaskan bahwa antropolog Koentjaraningrat membagi gotong royong dalam masyarakat Indonesia menjadi dua jenis berdasarkan sifat kegiatannya: yang pertama dilakukan untuk membantu sesama warga yang sedang membutuhkan, dan yang kedua dilakukan untuk kepentingan umum. Dua jenis gotong royong tersebut adalah ...",["Gotong royong politik dan gotong royong ekonomi","Gotong royong formal dan gotong royong informal","Gotong royong tolong-menolong dan gotong royong kerja bakti","Gotong royong keluarga dan gotong royong pemerintah","Gotong royong sukarela dan gotong royong paksaan"],2],

for(let g=0;g<5;g++)for(const t of"QCQZQCQ")D.push(t=="Q"?[...QS[qi],QE[qi++]]:t=="C"?["c",...CH[ci++]]:["z",...ZK[zi++]]);
let st,score,tm,last,muted=false,AC;
function tone(f,d,ty="sine",at=0,v=.15,f2){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+at;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={open:()=>{tone(500,.1,"square",0,.08);tone(750,.15,"square",.08,.08)},
ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,"triangle",i*.1)),
no:()=>tone(180,.5,"sawtooth",0,.12,90),
tick:()=>tone(1000,.06,"square",0,.06),
go:()=>{tone(440,.12,"triangle");tone(880,.2,"triangle",.12)},
up:()=>{tone(300,.2,"square",0,.1);tone(300,.4,"square",.25,.1)},
zonk:()=>{[[392,.3],[370,.3],[349,.3]].forEach((a,i)=>tone(a[0],a[1],"sawtooth",i*.32,.1));tone(330,1,"sawtooth",.96,.1,200)}};
function init(){st=Array(35).fill(null);score=0;$('#fin').style.display="none";draw()}
function draw(){const G=$('#grid');G.innerHTML='';
 D.forEach((d,i)=>{const b=document.createElement('button'),s=st[i];b.className='box'+(s?' done '+s:'');
  b.style.animationDelay=i*15+'ms';
  if(s)b.textContent=s=='ok'?'✅':s=='no'?'❌':d[1];else{b.dataset.c=i%5;b.textContent=i+1}
  b.onclick=()=>{if(!s)open(i)};G.appendChild(b)});
 $('#sc').textContent=score;const n=st.filter(Boolean).length;$('#op').textContent=n;
 if(n==35){const f=$('#fin');f.style.display="block";f.textContent="🏆 Semua box sudah terbuka! Skor akhir: "+score}}
function close(){clearInterval(tm);$('#ov').classList.remove('on');draw()}
function ring(sec){return`<div class="ring"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="30" fill="none" stroke="var(--bd)" stroke-width="7"/><circle id="rg" cx="36" cy="36" r="30" fill="none" stroke="var(--ac)" stroke-width="7" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="0" transform="rotate(-90 36 36)"/></svg><b id="tn">${sec}</b></div>`}
function timer(sec,end){clearInterval(tm);last=-1;const t0=Date.now();
 tm=setInterval(()=>{const l=Math.max(0,sec-(Date.now()-t0)/1000),c=Math.ceil(l);
  $('#rg').style.strokeDashoffset=188.5*(1-l/sec);$('#tn').textContent=c;$('#rg').style.stroke=l<=5?'var(--no)':'var(--ac)';
  if(c!=last&&c<=5&&c>0)sfx.tick();last=c;if(l<=0){clearInterval(tm);end()}},100)}
function open(i){sfx.open();const d=D[i],m=$('#md');$('#ov').classList.add('on');m.className='';
 const T={q:['Box '+(i+1)+' · Soal','var(--ac)'],c:['🎭 Box '+(i+1)+' · Challenge','var(--ch)'],z:['💀 Box '+(i+1)+' · ZONK','var(--zk)']}[d[0]];
 const head=sec=>`<div class="top"><span class="tag" style="background:${T[1]}">${T[0]}</span>${sec?ring(sec):''}</div>`;
 if(d[0]=='q'){
  m.innerHTML=head(QT)+`<div class="qemo">${d[4]}</div><p class="q">${d[1]}</p><div id="os"></div><div id="ft"></div>`;
  const fin=(k,msg)=>{clearInterval(tm);const right=k==d[3];
   m.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j==d[3])x.classList.add('ok')});
   if(k>=0&&!right)m.querySelectorAll('.opt')[k].classList.add('no');
   if(right){score+=10;sfx.ok()}else k<0?sfx.up():sfx.no();
   st[i]=right?'ok':'no';
   $('#ft').innerHTML=`<p class="fb">${msg||(right?'🎉 Benar! +10 poin':'😅 Belum tepat. Jawaban benar ditandai hijau.')}</p><button id="x">Tutup</button>`;$('#x').onclick=close};
  d[2].forEach((o,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+k)+'. '+o;b.onclick=()=>fin(k);$('#os').appendChild(b)});
  timer(QT,()=>fin(-1,'⏰ Waktu habis! Jawaban benar ditandai hijau.'));
 }else if(d[0]=='c'){
  m.innerHTML=head(d[3])+`<div class="hero"><span class="emo">${d[1]}</span><p class="big">${d[2]}</p><div class="row" id="ft"><button id="go">▶ Mulai (${d[3]} detik)</button></div></div>`;
  const done=t=>{clearInterval(tm);st[i]='ch';if(t)sfx.up();else sfx.ok();$('#ft').innerHTML=`<p class="fb" style="width:100%">${t?'⏰ Waktu habis! Mantap!':'🎉 Keren, selesai!'}</p><button id="x">Tutup</button>`;$('#x').onclick=close};
  $('#go').onclick=()=>{sfx.go();$('#ft').innerHTML='<button id="dn" class="sec">✔ Selesai lebih cepat</button>';$('#dn').onclick=()=>done(0);timer(d[3],()=>done(1))};
 }else{
  st[i]='zk';sfx.zonk();m.classList.add('zk');
  m.innerHTML=head(0)+`<div class="hero zk"><span class="emo">${d[1]}</span><p class="zt">${d[2]}</p><p class="big">${d[3]}</p><button id="x">Yah… oke deh 😭</button></div>`;$('#x').onclick=close;
 }}
$('#mu').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇 Mati':'🔊 Suara'};
$('#rs').onclick=()=>{if(confirm('Ulang dari awal?'))init()};
init();
</script></body></html>
